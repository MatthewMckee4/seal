name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  # renovate: datasource=github-releases depName=astral-sh/hawk
  HAWK_VERSION: 0.1.17
  # Must match the compiler used to build the pinned Hawk release.
  HAWK_RUST_VERSION: 1.99.0
  # renovate: datasource=docker depName=python
  PYTHON_VERSION: "3.14"
  RUSTUP_MAX_RETRIES: 10

jobs:
  determine_changes:
    name: "determine changes"

    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      # Flag that is raised when any code is changed
      code: ${{ steps.check_code.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine merge base
        id: merge_base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          sha=$(git merge-base HEAD "origin/${BASE_REF}")
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Check if there was any code related change
        id: check_code
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            . \
            ':!.gitattributes' \
            ':!.github/CODEOWNERS' \
            ':!.github/FUNDING.yml' \
            ':!.github/ISSUE_TEMPLATE/**' \
            ':!.github/PULL_REQUEST_TEMPLATE.md' \
            ':!.github/renovate.json5' \
            ':!.github/zizmor.yml' \
            ':!docs/' \
            ':!.markdownlint.yaml' \
            ':!.pre-commit-config.yaml' \
            ':!AGENTS.md' \
            ':!CHANGELOG.md' \
            ':!CODE_OF_CONDUCT.md' \
            ':!CONTRIBUTING.md' \
            ':!LICENSE' \
            ':!README.md' \
            ':!SECURITY.md' \
            ':!STYLE.md' \
            ':!seal.toml' \
            ':!zensical.toml' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  pre-commit:
    name: "pre commit"

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: "Install Rust components"
        run: rustup component add rustfmt clippy

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  cargo-hawk:
    name: "cargo hawk"

    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: "Install Hawk toolchain"
        run: rustup toolchain install "${HAWK_RUST_VERSION}" --profile minimal

      - name: "Install Hawk"
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh

      - name: "Check public Rust APIs"
        run: cargo +"${HAWK_RUST_VERSION}" hawk check -D warnings -D hawk::unnecessary_crate_visibility

  cargo-shear:
    name: "cargo shear"

    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install cargo shear"
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          # renovate: datasource=crate depName=cargo-shear
          tool: cargo-shear@1.12.4

      - name: "Check unused dependencies"
        run: cargo shear --deny-warnings

  build-docs:
    name: "Build docs"

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Prepare docs
        run: uv run --script scripts/prepare_docs.py

      - name: Build docs
        run: uv run --isolated --with-requirements docs/requirements.txt zensical build

  cargo-test:
    name: "cargo test (${{ matrix.os }})"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    needs: determine_changes

    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    strategy:
      max-parallel: 18
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest

      - name: "Test default features"
        run: cargo nextest run --locked --no-fail-fast

      - name: "Test mocked CLI commands"
        run: cargo nextest run --locked --no-fail-fast --all-features -p seal --test it -E 'test(bump::) | test(generate::)'

  coverage:
    name: "coverage"

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write

    needs: determine_changes

    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: "Install Rust toolchain"
        run: rustup show

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate code coverage
        run: cargo llvm-cov nextest --locked --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          slug: MatthewMckee4/seal
          fail_ci_if_error: true
          use_oidc: true
          use_pypi: true

  generated-references:
    name: "generated references"

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check generated references
        run: |
          cargo dev --locked generate-cli-reference --mode check
          cargo dev --locked generate-options --mode check

  ci-gate:
    name: "CI gate"

    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - determine_changes
      - pre-commit
      - cargo-hawk
      - cargo-shear
      - build-docs
      - cargo-test
      - coverage
      - generated-references
    if: ${{ always() }}

    steps:
      - name: Require successful validation
        env:
          DETERMINE_CHANGES_RESULT: ${{ needs.determine_changes.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          BUILD_DOCS_RESULT: ${{ needs.build-docs.result }}
          GENERATED_REFERENCES_RESULT: ${{ needs.generated-references.result }}
          CARGO_HAWK_RESULT: ${{ needs.cargo-hawk.result }}
          CARGO_SHEAR_RESULT: ${{ needs.cargo-shear.result }}
          CARGO_TEST_RESULT: ${{ needs.cargo-test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          CODE_CHANGED: ${{ needs.determine_changes.outputs.code }}
        run: |
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 finished with result '$2'"
              exit 1
            fi
          }

          require_code_validation() {
            case "$2" in
              success)
                ;;
              skipped)
                if [ "$CODE_CHANGED" != "false" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
                  echo "::error::$1 was unexpectedly skipped"
                  exit 1
                fi
                ;;
              *)
                echo "::error::$1 finished with result '$2'"
                exit 1
                ;;
            esac
          }

          require_success "determine changes" "$DETERMINE_CHANGES_RESULT"
          require_success "pre commit" "$PRE_COMMIT_RESULT"
          require_success "Build docs" "$BUILD_DOCS_RESULT"
          require_success "generated references" "$GENERATED_REFERENCES_RESULT"

          if [ "$CODE_CHANGED" != "true" ] && [ "$CODE_CHANGED" != "false" ]; then
            echo "::error::determine changes produced unexpected code output '$CODE_CHANGED'"
            exit 1
          fi

          require_code_validation "cargo hawk" "$CARGO_HAWK_RESULT"
          require_code_validation "cargo shear" "$CARGO_SHEAR_RESULT"
          require_code_validation "cargo test" "$CARGO_TEST_RESULT"
          require_code_validation "coverage" "$COVERAGE_RESULT"
