# Configuration for the zizmor static analysis tool, run via pre-commit in CI
# https://docs.zizmor.sh/configuration/
#
rules:
  misfeature:
    # The Windows setup action uses cmd to append a path to the runner command file.
    ignore:
      - action.yml
      - .github/actions/setup-seal/action.yml
  github-env:
    # The setup action must export its isolated install directory to later steps.
    ignore:
      - action.yml
      - .github/actions/setup-seal/action.yml
  template-injection:
    ignore:
      # like with `secrets-inherit`, `cargo dist` introduces some
      # template injections. We've manually audited these usages for safety.
      - release.yml
  secrets-inherit:
    # `cargo dist` makes extensive use of `secrets: inherit`,
    # and we can't easily fix that until an upstream release changes that.
    disable: true
  excessive-permissions:
    # cargo-dist generates workflow-level release permissions.
    ignore:
      - release.yml
  unpinned-images:
    # cargo-dist supplies its build containers through the generated matrix.
    ignore:
      - release.yml
