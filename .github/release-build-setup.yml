- name: Install GNU toolchain for PowerPC64
  if: contains(matrix.targets, 'powerpc64-unknown-linux-gnu')
  run: |
    # Zig cannot compile and link the big-endian PowerPC64 ELFv1 target.
    sudo apt-get update
    sudo apt-get install --yes gcc-powerpc64-linux-gnu libc6-dev-ppc64-cross
    echo "CC_powerpc64_unknown_linux_gnu=powerpc64-linux-gnu-gcc" >> "$GITHUB_ENV"
    echo "CARGO_TARGET_POWERPC64_UNKNOWN_LINUX_GNU_LINKER=powerpc64-linux-gnu-gcc" >> "$GITHUB_ENV"
